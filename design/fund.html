  <body class="bg-surface text-on-background min-h-screen pb-24">
    <!-- TopAppBar -->
    <header
      class="bg-surface text-primary flex justify-between items-center px-margin-mobile py-sm w-full sticky top-0 z-50"
    >
      <div
        class="w-10 h-10 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center"
      >
        <span
          class="material-symbols-outlined text-on-surface-variant"
          data-icon="person"
          >person</span
        >
      </div>
      <h1
        class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary"
      >
        MoneyFamily
      </h1>
      <button
        class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity"
      >
        <span class="material-symbols-outlined" data-icon="notifications"
          >notifications</span
        >
      </button>
    </header>
    <main class="max-w-md mx-auto px-margin-mobile mt-md flex flex-col gap-lg">
      <!-- Header Section -->
      <div>
        <h2 class="font-title-md text-title-md text-on-background mb-xs">
          Quỹ Gia Đình
        </h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Quản lý thành viên và mời người thân tham gia quỹ.
        </p>
      </div>
      <!-- Invite Card (Bento style) -->
      <div
        class="bg-white rounded-xl p-lg shadow-[0_4px_20px_rgba(0,0,0,0.04)] flex flex-col items-center text-center"
      >
        <div class="font-title-md text-title-md mb-md">Mã mời gia đình</div>
        <div
          class="w-48 h-48 bg-surface-container-high rounded-lg mb-md flex items-center justify-center relative overflow-hidden"
        >
          <img
            class="w-full h-full object-cover"
            data-alt="A clean, modern QR code graphic designed for scanning, integrated smoothly into a light minimalist interface. The QR pattern should be sharp and clear, in a soft dark gray against a pure white background, avoiding harsh blacks. A subtle green accent or friendly abstract shape sits comfortably in the center. The aesthetic is modern, approachable, and digital-first, illuminated by soft ambient lighting."

          />
        </div>
        <p class="font-body-sm text-body-sm text-on-surface-variant mb-md">
          Quét mã QR này hoặc chia sẻ liên kết để mời thành viên mới.
        </p>
        <button
          class="w-full bg-primary text-on-primary py-sm px-lg rounded-full font-label-md text-label-md flex items-center justify-center gap-xs shadow-[0_4px_20px_rgba(0,0,0,0.08)] hover:scale-95 transition-transform duration-100"
        >
          <span class="material-symbols-outlined" data-icon="content_copy"
            >content_copy</span
          >
          Sao chép link mời
        </button>
      </div>
      <!-- Member List Section -->
      <div>
        <h3 class="font-title-md text-title-md text-on-background mb-md">
          Thành viên (4)
        </h3>
        <div class="flex flex-col gap-sm">
          <!-- Member 1: Trưởng quỹ -->
          <div
            class="bg-white rounded-xl p-md shadow-[0_4px_20px_rgba(0,0,0,0.04)] flex items-center justify-between"
          >
            <div class="flex items-center gap-sm">
              <div
                class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-high"
              >
                <img
                  class="w-full h-full object-cover"
                  data-alt="A bright, cheerful portrait photo of a young modern Asian man smiling warmly. He is wearing a simple casual white t-shirt. The background is a soft, out-of-focus cozy living room with natural daylight pouring in. The lighting is flattering and cinematic, emphasizing an approachable, friendly, and trustworthy vibe typical of a modern lifestyle app avatar."

                  Minh Trí (Bạn)
                </div>
                <div
                  class="font-label-md text-label-md text-primary bg-primary-container px-2 py-1 rounded inline-block mt-1"
                >
                  Trưởng quỹ
                </div>
              </div>
            </div>
          </div>
          <!-- Member 2: Thành viên -->
          <div
            class="bg-white rounded-xl p-md shadow-[0_4px_20px_rgba(0,0,0,0.04)] flex items-center justify-between"

            <div class="flex items-center gap-sm">
              <div
                class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-high"
              >
                <img
                  class="w-full h-full object-cover"
                  data-alt="A bright, cheerful portrait photo of a young modern Asian woman with shoulder-length hair smiling warmly. She is wearing a soft beige knit sweater. The background is a soft, out-of-focus cozy kitchen with warm morning light. The lighting is flattering and cinematic, emphasizing an approachable, friendly, and trustworthy vibe typical of a modern lifestyle app avatar."

                />
              </div>
              <div>

                  Lan Anh
                </div>
                <div class="font-body-sm text-body-sm text-on-surface-variant">
                  Thành viên
                </div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1">
              <span class="font-label-md text-label-md text-on-surface-variant"
                >Quyền chỉnh sửa</span

              <label class="relative inline-flex items-center cursor-pointer">
                <input
                  checked=""

                  type="checkbox"
                  value=""
                />
                <div
                  class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"

                <div class="font-body-sm text-body-sm text-on-surface-variant">

            </div>
            <div class="flex flex-col items-end gap-1">
              <span class="font-label-md text-label-md text-on-surface-variant"

              <label class="relative inline-flex items-center cursor-pointer">
                <input class="sr-only peer" type="checkbox" value="" />
                <div
                  class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"
                ></div>
              </label>
            </div>
          </div>
        </div>

    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-6 pt-2 bg-surface-container shadow-[0_-4px_20px_rgba(0,0,0,0.04)] rounded-t-xl md:hidden"
    >
      <button

      >
        <span class="material-symbols-outlined" data-icon="home">home</span>
        <span class="font-label-md text-label-md mt-1">Home</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant/50 rounded-full"
      >
        <span class="material-symbols-outlined" data-icon="history"
          >history</span
        >
        <span class="font-label-md text-label-md mt-1">History</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant/50 rounded-full"
      >
        <span class="material-symbols-outlined" data-icon="add_circle"
          >add_circle</span

        <span class="font-label-md text-label-md mt-1">Add</span>

      <button
        class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-lg py-xs hover:bg-surface-variant/50 active:scale-90 transition-transform duration-150"
      >
        <span
          class="material-symbols-outlined"
          data-icon="group"
          style="font-variation-settings: &quot;FILL&quot; 1"

      >
        <span class="material-symbols-outlined" data-icon="person">person</span>
