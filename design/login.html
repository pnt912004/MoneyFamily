<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>MoneyFamily - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f8f9fa",
              "on-background": "#191c1d",
              "on-primary-container": "#003b0b",
              "tertiary-fixed": "#abf4ac",
              error: "#ba1a1a",
              "surface-container-highest": "#e1e3e4",
              "primary-container": "#4bae4f",
              "surface-container": "#edeeef",
              "primary-fixed-dim": "#78dc77",
              primary: "#006e1c",
              "on-secondary-container": "#725b00",
              "tertiary-container": "#65a969",
              "surface-container-high": "#e7e8e9",
              "secondary-fixed-dim": "#ebc23e",
              "on-tertiary-container": "#003b11",
              "on-secondary-fixed-variant": "#574500",
              "inverse-on-surface": "#f0f1f2",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "inverse-primary": "#78dc77",
              "surface-tint": "#006e1c",
              tertiary: "#286b33",
              background: "#f8f9fa",
              "on-primary-fixed-variant": "#005313",
              "on-secondary": "#ffffff",
              "on-secondary-fixed": "#241a00",
              "surface-dim": "#d9dadb",
              "on-tertiary": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "secondary-fixed": "#ffe087",
              "on-surface-variant": "#3f4a3c",
              "tertiary-fixed-dim": "#90d792",
              "inverse-surface": "#2e3132",
              "error-container": "#ffdad6",
              outline: "#6f7a6b",
              "surface-variant": "#e1e3e4",
              "on-primary-fixed": "#002204",
              "surface-bright": "#f8f9fa",
              "primary-fixed": "#94f990",
              "on-error": "#ffffff",
              "on-tertiary-fixed-variant": "#07521d",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#fdd34d",
              "on-surface": "#191c1d",
              "outline-variant": "#becab9",
              "on-tertiary-fixed": "#002107",
              secondary: "#735c00",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              lg: "24px",
              xs: "8px",
              gutter: "16px",
              "margin-desktop": "40px",
              base: "4px",
              md: "16px",
              xl: "32px",
              "margin-mobile": "20px",
              sm: "12px",
            },
            fontFamily: {
              "body-lg": ["Be Vietnam Pro"],
              "body-sm": ["Be Vietnam Pro"],
              "title-md": ["Be Vietnam Pro"],
              "headline-lg-mobile": ["Be Vietnam Pro"],
              "headline-lg": ["Be Vietnam Pro"],
              "display-lg": ["Be Vietnam Pro"],
              "label-md": ["Be Vietnam Pro"],
            },
            fontSize: {
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "700" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "display-lg": [
                "40px",
                {
                  lineHeight: "48px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .input-active:focus-within {
        border-color: #006e1c;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg"
  >
    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col md:flex-row min-h-screen">
      <!-- Illustration Section (Desktop) / Top Section (Mobile) -->
      <section
        class="w-full md:w-1/2 bg-primary-container/20 flex flex-col items-center justify-center p-lg relative overflow-hidden hidden md:flex"
      >
        <!-- Decorative Elements -->
        <div
          class="absolute top-10 left-10 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-50"
        ></div>
        <div
          class="absolute bottom-10 right-10 w-48 h-48 bg-secondary-container rounded-full blur-3xl opacity-40"
        ></div>
        <div class="z-10 text-center max-w-md">
          <h1 class="font-display-lg text-display-lg text-primary mb-md">
            MoneyFamily
          </h1>
          <p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
            Quản lý tài chính gia đình ấm áp, minh bạch và dễ dàng.
          </p>
          <div
            class="w-full aspect-square max-w-sm mx-auto relative rounded-3xl overflow-hidden shadow-lg border-4 border-surface"
          >
            <img
              class="object-cover w-full h-full"
              data-alt="A heart-warming digital illustration of a modern family, parents and a child, sitting together around a cozy living room table. They are cheerfully looking at a tablet showing colorful pie charts. The art style is soft, modern, and inviting, using a warm color palette with natural greens, soft yellows, and crisp whites. The lighting is bright and cheerful, evoking a sense of trust, safety, and family unity in a light-mode UI setting."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZEt6kKfh_2QKdO3Zmgo9GwOgYk5zIhBayjZYMtME_isel1QAPE7MPgLFiUXv_OVjgJ86FTUXYzQDXz7v26LUbL1v-AFe50bvxV-Q1MSzwwENVhckLVb0H7s7LoIS84qnz0K0CqB-_45HxK_LE4NrowQ9UNGuDMjwreSemcPafQ-7vWwD9GSJE5nBdtS6CtlQBsOT-hSP752-ge_N0xAYNeHC0vzz6Fwr-SFtn5fkTfdQ7UcJH9zbJ"
            />
          </div>
        </div>
      </section>
      <!-- Form Section -->
      <section
        class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-xl bg-surface relative z-10"
      >
        <!-- Mobile Header (Hidden on Desktop) -->
        <div class="md:hidden text-center mb-xl">
          <h1
            class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold"
          >
            MoneyFamily
          </h1>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-base">
            Quản lý tài chính gia đình
          </p>
          <div
            class="w-32 h-32 mx-auto mt-md rounded-full overflow-hidden shadow-md"
          >
            <img
              class="object-cover w-full h-full"
              data-alt="A soft, modern vector illustration of a stylized house with a coin dropping into it, surrounded by subtle green and yellow glowing dots. The aesthetic is friendly, minimal, and financial-themed but warm, set against a pristine white background with soft diffused lighting."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDU28OHCiRTBd_tu1krhHiEBudtNzvaHX4cuEdcxjwTLodOcRbYV1W2RTt1cDvhBR9OCuwKBQy3QHa8xw_X44v9jHObJUV4EuH4xwqMs0K2tzyZG3WC5o00wEjPnfeuUmnrkPm5O84g36V99YlHY6yKipKRMyCkFAQsm-cGSAYpS_GurIPvgj6x3KoT6Ip3qOD04ho-098_6tdKnaXYiiMbQdV97uCR-rB9zSlUu-p16jMo78MMGYC8"
            />
          </div>
        </div>
        <div class="w-full max-w-md mx-auto">
          <div class="mb-lg">
            <h2
              class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs"
            >
              Chào mừng trở lại!
            </h2>
            <p
              class="font-body-sm md:font-body-lg text-body-sm md:text-body-lg text-on-surface-variant"
            >
              Đăng nhập để tiếp tục quản lý quỹ gia đình.
            </p>
          </div>
          <form class="space-y-sm">
            <!-- Email/Phone Input -->
            <div
              class="relative bg-surface-container rounded-lg p-xs transition-colors input-active"
            >
              <label
                class="font-label-md text-label-md text-outline block px-xs pt-xs"
                for="login-id"
                >Email hoặc Số điện thoại</label
              >
              <div class="flex items-center px-xs pb-xs">
                <span
                  class="material-symbols-outlined text-outline mr-xs"
                  style="font-variation-settings: &quot;FILL&quot; 0"
                  >person</span
                >
                <input
                  class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant"
                  id="login-id"
                  placeholder="Nhập email hoặc số điện thoại"
                  type="text"
                />
              </div>
            </div>
            <!-- Password Input -->
            <div
              class="relative bg-surface-container rounded-lg p-xs transition-colors input-active"
            >
              <label
                class="font-label-md text-label-md text-outline block px-xs pt-xs"
                for="password"
                >Mật khẩu</label
              >
              <div class="flex items-center px-xs pb-xs">
                <span
                  class="material-symbols-outlined text-outline mr-xs"
                  style="font-variation-settings: &quot;FILL&quot; 0"
                  >lock</span
                >
                <input
                  class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant"
                  id="password"
                  placeholder="Nhập mật khẩu"
                  type="password"
                />
                <button
                  class="text-outline hover:text-primary transition-colors ml-xs"
                  type="button"
                >
                  <span class="material-symbols-outlined">visibility_off</span>
                </button>
              </div>
            </div>
            <div class="flex justify-end pt-base">
              <a
                class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors"
                href="#"
                >Quên mật khẩu?</a
              >
            </div>
            <!-- Login Button -->
            <button
              class="w-full bg-primary text-on-primary rounded-full py-sm px-lg font-title-md text-title-md hover:bg-surface-tint shadow-[0_4px_20px_rgba(0,0,0,0.08)] hover:shadow-[0_2px_10px_rgba(0,0,0,0.04)] transition-all flex items-center justify-center mt-md active:scale-95 duration-100"
              type="submit"
            >
              Đăng nhập
            </button>
          </form>
          <!-- Divider -->
          <div class="flex items-center my-lg">
            <div class="flex-grow border-t border-surface-variant"></div>
            <span class="mx-md font-body-sm text-body-sm text-outline"
              >hoặc</span
            >
            <div class="flex-grow border-t border-surface-variant"></div>
          </div>
          <!-- Join Fund Alternative Action -->
          <button
            class="w-full bg-surface-container hover:bg-surface-container-high text-on-surface rounded-full py-sm px-lg font-title-md text-title-md transition-colors flex items-center justify-center border border-surface-variant shadow-sm active:scale-95 duration-100 group"
            type="button"
          >
            <span
              class="material-symbols-outlined mr-sm text-primary group-hover:scale-110 transition-transform"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >qr_code_scanner</span
            >
            Tham gia Quỹ qua Link/QR
          </button>
          <!-- Sign up prompt -->
          <div class="text-center mt-xl">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
              Gia đình bạn chưa có quỹ?
              <a
                class="font-title-md text-body-sm text-primary hover:underline ml-xs"
                href="#"
                >Tạo quỹ mới</a
              >
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
