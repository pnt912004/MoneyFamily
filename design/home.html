<!doctype html>

<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <title>MoneyFamily - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f8f9fa",
              "on-background": "#191c1d",
              "on-primary-container": "#003b0b",
              "tertiary-fixed": "#abf4ac",
              error: "#ba1a1a",
              "surface-container-highest": "#e1e3e4",
              "primary-container": "#4bae4f",
              "surface-container": "#edeeef",
              "primary-fixed-dim": "#78dc77",
              primary: "#006e1c",
              "on-secondary-container": "#725b00",
              "tertiary-container": "#65a969",
              "surface-container-high": "#e7e8e9",
              "secondary-fixed-dim": "#ebc23e",
              "on-tertiary-container": "#003b11",
              "on-secondary-fixed-variant": "#574500",
              "inverse-on-surface": "#f0f1f2",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "inverse-primary": "#78dc77",
              "surface-tint": "#006e1c",
              tertiary: "#286b33",
              background: "#f8f9fa",
              "on-primary-fixed-variant": "#005313",
              "on-secondary": "#ffffff",
              "on-secondary-fixed": "#241a00",
              "surface-dim": "#d9dadb",
              "on-tertiary": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "secondary-fixed": "#ffe087",
              "on-surface-variant": "#3f4a3c",
              "tertiary-fixed-dim": "#90d792",
              "inverse-surface": "#2e3132",
              "error-container": "#ffdad6",
              outline: "#6f7a6b",
              "surface-variant": "#e1e3e4",
              "on-primary-fixed": "#002204",
              "surface-bright": "#f8f9fa",
              "primary-fixed": "#94f990",
              "on-error": "#ffffff",
              "on-tertiary-fixed-variant": "#07521d",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#fdd34d",
              "on-surface": "#191c1d",
              "outline-variant": "#becab9",
              "on-tertiary-fixed": "#002107",
              secondary: "#735c00",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              lg: "24px",
              xs: "8px",
              gutter: "16px",
              "margin-desktop": "40px",
              base: "4px",
              md: "16px",
              xl: "32px",
              "margin-mobile": "20px",
              sm: "12px",
            },
            fontFamily: {
              "body-lg": ["Be Vietnam Pro", "sans-serif"],
              "body-sm": ["Be Vietnam Pro", "sans-serif"],
              "title-md": ["Be Vietnam Pro", "sans-serif"],
              "headline-lg-mobile": ["Be Vietnam Pro", "sans-serif"],
              "headline-lg": ["Be Vietnam Pro", "sans-serif"],
              "display-lg": ["Be Vietnam Pro", "sans-serif"],
              "label-md": ["Be Vietnam Pro", "sans-serif"],
            },
            fontSize: {
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "700" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "display-lg": [
                "40px",
                {
                  lineHeight: "48px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: theme("colors.background");
        color: theme("colors.on-background");
        -webkit-tap-highlight-color: transparent;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      }

      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .icon-filled {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      /* Hide scrollbar for horizontal scroll areas */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="font-body-lg text-body-lg bg-background min-h-screen pb-32">
    <!-- TopAppBar -->
    <header
      class="flex justify-between items-center px-margin-mobile py-sm w-full sticky top-0 z-50 bg-surface dark:bg-on-background shadow-[0_4px_20px_rgba(0,0,0,0.02)] md:px-margin-desktop transition-all duration-300"
    >
      <div class="flex items-center gap-sm">
        <img
          class="w-10 h-10 rounded-full object-cover border-2 border-primary-container"
          data-alt="A warm, brightly lit portrait photo of a smiling Vietnamese mother, optimized for an avatar in a family finance app. Soft natural lighting, high quality, optimistic mood, modern clean aesthetic."
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdLHYSohqv3aZl6S3_lrD0STAP296ubGRnoo49StQbTskY7preNsvosXRzKlcOHfj32vdMnb6YGNB2x7N4uE-fEvoL0iV0Upcqstnr_JKkVAFD8lhZDX_OrmR1VxBQYwp28LiotbSJ7PgYFEDE5efYB4BNUqtdSjvHo828yv5Pf-fE8nVTx7qzNaGVJjj1loGOcd73fbh0OZZkGIpOSdKAtDlJ7_-YP4nMNj84mrY3GMSfMqAIHXiU"
        />
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim md:font-headline-lg md:text-headline-lg"
        >
          MoneyFamily
        </h1>
      </div>
      <button
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-100"
      >
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </header>
    <!-- Main Content -->
    <main
      class="max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-lg space-y-xl"
    >
      <!-- Header / Greeting -->
      <div class="space-y-1">
        <h2 class="font-title-md text-title-md text-on-surface-variant">
          Tổng quan tuần này
        </h2>
        <p class="font-body-sm text-body-sm text-outline">
          12 Thg 10 - 18 Thg 10
        </p>
      </div>
      <!-- Bento Grid Layout -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-lg">
        <!-- Main Balance Card -->
        <div
          class="md:col-span-8 glass-card rounded-xl p-lg space-y-lg relative overflow-hidden"
        >
          <!-- Decorative subtle background blob -->
          <div
            class="absolute -right-20 -top-20 w-64 h-64 bg-primary-container opacity-20 rounded-full blur-3xl"
          ></div>
          <div class="flex justify-between items-start z-10 relative">
            <div>
              <p class="font-body-sm text-body-sm text-on-surface-variant mb-1">
                Số dư hiện tại
              </p>
              <h3 class="font-display-lg text-display-lg text-on-background">
                12.500.000₫
              </h3>
            </div>
            <div
              class="bg-surface-container rounded-full px-sm py-1 flex items-center gap-1"
            >
              <span
                class="w-2 h-2 rounded-full bg-primary animate-pulse"
              ></span>
              <span class="font-label-md text-label-md text-on-surface-variant"
                >Đang tốt</span
              >
            </div>
          </div>
          <div class="space-y-2 z-10 relative">
            <div class="flex justify-between text-body-sm font-body-sm">
              <span class="text-on-surface-variant"
                >Đã tiêu:
                <span class="font-bold text-on-background"
                  >4.500.000₫</span
                ></span
              >
              <span class="text-outline">Hạn mức: 8.000.000₫</span>
            </div>
            <!-- Progress Bar -->
            <div class="h-2 w-full bg-primary/10 rounded-full overflow-hidden">
              <div
                class="h-full bg-primary rounded-full transition-all duration-1000 ease-out"
                style="width: 56%"
              ></div>
            </div>
            <p
              class="font-label-md text-label-md text-primary-container text-right"
            >
              Còn lại 3.500.000₫
            </p>
          </div>
        </div>
        <!-- Smart Suggestion -->
        <div
          class="md:col-span-4 bg-secondary-container/30 border border-secondary-container/50 rounded-xl p-lg flex flex-col justify-between hover:shadow-lg transition-shadow duration-300"
        >
          <div class="space-y-sm">
            <div
              class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center text-secondary mb-2"
            >
              <span class="material-symbols-outlined icon-filled"
                >lightbulb</span
              >
            </div>
            <h4
              class="font-title-md text-title-md text-on-background leading-tight"
            >
              Gợi ý thông minh
            </h4>
            <p class="font-body-sm text-body-sm text-on-surface-variant">
              Bạn đang dư 500k so với kế hoạch, chuyển vào Quỹ du lịch nhé?
            </p>
          </div>
          <button
            class="mt-md w-full bg-secondary text-on-secondary font-label-md text-label-md py-sm rounded-lg hover:opacity-90 transition-opacity active:scale-[0.98]"
          >
            Chuyển ngay
          </button>
        </div>
      </div>
      <!-- Quick Entry Section -->
      <div class="space-y-md">
        <h3 class="font-title-md text-title-md text-on-background">
          Nhập liệu siêu tốc
        </h3>
        <div
          class="flex gap-sm overflow-x-auto hide-scrollbar pb-2 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0"
        >
          <!-- Quick Entry Button 1 -->
          <button
            class="flex-shrink-0 bg-surface rounded-xl p-sm border border-surface-variant shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex flex-col items-center justify-center gap-2 w-[100px] hover:shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:bg-surface-container-low transition-all active:scale-95"
          >
            <div
              class="w-12 h-12 rounded-full bg-[#E3F2FD] text-[#1976D2] flex items-center justify-center"
            >
              <span class="material-symbols-outlined icon-filled"
                >shopping_cart</span
              >
            </div>
            <span
              class="font-label-md text-label-md text-on-background text-center w-full truncate"
              >Đi chợ sáng</span
            >
          </button>
          <!-- Quick Entry Button 2 -->
          <button
            class="flex-shrink-0 bg-surface rounded-xl p-sm border border-surface-variant shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex flex-col items-center justify-center gap-2 w-[100px] hover:shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:bg-surface-container-low transition-all active:scale-95"
          >
            <div
              class="w-12 h-12 rounded-full bg-[#FFF3E0] text-[#F57C00] flex items-center justify-center"
            >
              <span class="material-symbols-outlined icon-filled"
                >local_cafe</span
              >
            </div>
            <span
              class="font-label-md text-label-md text-on-background text-center w-full truncate"
              >Sữa cho con</span
            >
          </button>
          <!-- Quick Entry Button 3 -->
          <button
            class="flex-shrink-0 bg-surface rounded-xl p-sm border border-surface-variant shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex flex-col items-center justify-center gap-2 w-[100px] hover:shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:bg-surface-container-low transition-all active:scale-95"
          >
            <div
              class="w-12 h-12 rounded-full bg-[#E8F5E9] text-[#388E3C] flex items-center justify-center"
            >
              <span class="material-symbols-outlined icon-filled"
                >directions_car</span
              >
            </div>
            <span
              class="font-label-md text-label-md text-on-background text-center w-full truncate"
              >Đổ xăng</span
            >
          </button>
          <!-- Quick Entry Button 4 -->
          <button
            class="flex-shrink-0 bg-surface rounded-xl p-sm border border-surface-variant shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex flex-col items-center justify-center gap-2 w-[100px] hover:shadow-[0_4px_8px_rgba(0,0,0,0.04)] hover:bg-surface-container-low transition-all active:scale-95"
          >
            <div
              class="w-12 h-12 rounded-full bg-[#FCE4EC] text-[#C2185B] flex items-center justify-center"
            >
              <span class="material-symbols-outlined icon-filled"
                >favorite</span
              >
            </div>
            <span
              class="font-label-md text-label-md text-on-background text-center w-full truncate"
              >Mua sắm</span
            >
          </button>
          <!-- Add Custom Quick Entry -->
          <button
            class="flex-shrink-0 bg-surface-container rounded-xl p-sm border border-dashed border-outline-variant flex flex-col items-center justify-center gap-2 w-[100px] hover:bg-surface-container-high transition-colors"
          >
            <div
              class="w-12 h-12 rounded-full text-on-surface-variant flex items-center justify-center"
            >
              <span class="material-symbols-outlined">add</span>
            </div>
            <span
              class="font-label-md text-label-md text-on-surface-variant text-center"
              >Thêm mẫu</span
            >
          </button>
        </div>
      </div>
    </main>
    <!-- Floating Action Button -->
    <button
      class="fixed right-margin-mobile md:right-margin-desktop bottom-24 md:bottom-10 z-40 bg-primary text-on-primary rounded-2xl w-14 h-14 flex items-center justify-center shadow-lg hover:shadow-xl hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-90 duration-150"
    >
      <span
        class="material-symbols-outlined icon-filled"
        style="font-size: 28px"
        >add</span
      >
    </button>
    <!-- BottomNavBar (Mobile Only) -->
    <nav
      class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-6 pt-2 bg-surface-container dark:bg-surface-dim shadow-[0_-4px_20px_rgba(0,0,0,0.04)] rounded-t-xl transition-all duration-300"
    >
      <!-- Active Tab: Home -->
      <button
        class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-full px-lg py-xs hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150"
      >
        <span class="material-symbols-outlined icon-filled">home</span>
        <span class="font-label-md text-label-md mt-1">Home</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 hover:bg-surface-variant/50 dark:hover:bg-surface-container-high rounded-full hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150"
      >
        <span class="material-symbols-outlined">history</span>
        <span class="font-label-md text-label-md mt-1">History</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 hover:bg-surface-variant/50 dark:hover:bg-surface-container-high rounded-full hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150"
      >
        <span class="material-symbols-outlined">add_circle</span>
        <span class="font-label-md text-label-md mt-1">Add</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 hover:bg-surface-variant/50 dark:hover:bg-surface-container-high rounded-full hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150"
      >
        <span class="material-symbols-outlined">group</span>
        <span class="font-label-md text-label-md mt-1">Fund</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 hover:bg-surface-variant/50 dark:hover:bg-surface-container-high rounded-full hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150"
      >
        <span class="material-symbols-outlined">person</span>
        <span class="font-label-md text-label-md mt-1">Profile</span>
      </button>
    </nav>
    <!-- Desktop Navigation Cluster (Injected logically for wider screens) -->
    <div
      class="hidden md:flex fixed top-0 left-1/2 -translate-x-1/2 h-[72px] items-center gap-4 z-50 pointer-events-none"
    >
      <div
        class="bg-surface/90 backdrop-blur pointer-events-auto px-4 py-2 rounded-full shadow-sm border border-surface-variant flex gap-2"
      >
        <button
          class="px-4 py-2 bg-primary-container text-on-primary-container rounded-full font-label-md flex items-center gap-2"
        >
          <span class="material-symbols-outlined icon-filled text-[18px]"
            >home</span
          >
          Home
        </button>
        <button
          class="px-4 py-2 text-on-surface-variant hover:bg-surface-variant rounded-full font-label-md flex items-center gap-2 transition-colors"
        >
          <span class="material-symbols-outlined text-[18px]">history</span>
          History
        </button>
        <button
          class="px-4 py-2 text-on-surface-variant hover:bg-surface-variant rounded-full font-label-md flex items-center gap-2 transition-colors"
        >
          <span class="material-symbols-outlined text-[18px]">group</span>
          Fund
        </button>
        <button
          class="px-4 py-2 text-on-surface-variant hover:bg-surface-variant rounded-full font-label-md flex items-center gap-2 transition-colors"
        >
          <span class="material-symbols-outlined text-[18px]">person</span>
          Profile
        </button>
      </div>
    </div>
  </body>
</html>
